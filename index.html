<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miniature Schnauzer</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe3ea;font-family:system-ui,sans-serif}
#h{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:#3b4f57;font-size:13px;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><div id="h">Drag to orbit · scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from './vendor/OrbitControls.js';
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);
r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
r.toneMapping=THREE.ACESFilmicToneMapping;r.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene=new THREE.Scene();
// gradient bg
const c=document.createElement('canvas');c.width=2;c.height=256;const g=c.getContext('2d');
const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#e9f4f7');gr.addColorStop(1,'#b9d4dc');g.fillStyle=gr;g.fillRect(0,0,2,256);
const bg=new THREE.CanvasTexture(c);bg.colorSpace=THREE.SRGBColorSpace;scene.background=bg;
const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);cam.position.set(4.6,2.6,5.6);
const ctl=new OrbitControls(cam,r.domElement);ctl.target.set(0,1.3,0);ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI*.49;ctl.minDistance=3;ctl.maxDistance=12;
scene.add(new THREE.HemisphereLight(0xffffff,0x9db8a0,1.0));
const sun=new THREE.DirectionalLight(0xfff2dd,2.4);sun.position.set(4,8,5);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:1,far:25});sun.shadow.radius=5;sun.shadow.bias=-.0005;scene.add(sun);
const rim=new THREE.DirectionalLight(0xbfdcff,1);rim.position.set(-5,3,-4);scene.add(rim);
// ground
const ground=new THREE.Mesh(new THREE.CircleGeometry(6,64),new THREE.MeshStandardMaterial({color:0xa9cf9a,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const ring=new THREE.Mesh(new THREE.RingGeometry(5.9,6,64),new THREE.MeshBasicMaterial({color:0x8fb882}));ring.rotation.x=-Math.PI/2;ring.position.y=.002;scene.add(ring);

const M=(col,rough=.9)=>new THREE.MeshStandardMaterial({color:col,roughness:rough,flatShading:true});
const grey=M(0x7d8185),dark=M(0x45484c),light=M(0xc9ccce),cream=M(0xe6e3dc),black=M(0x111111,.3),nose=M(0x151515,.35);
function mesh(geo,mat,p=[0,0,0],s=[1,1,1],rot=[0,0,0],parent){
 const m=new THREE.Mesh(geo,mat);m.position.set(...p);m.scale.set(...s);m.rotation.set(...rot);m.castShadow=true;m.receiveShadow=true;if(parent)parent.add(m);return m;}
const sph=new THREE.IcosahedronGeometry(1,1), box=new THREE.BoxGeometry(1,1,1), cyl=new THREE.CylinderGeometry(1,1,1,8), cone=new THREE.ConeGeometry(1,1,6);
const dog=new THREE.Group();scene.add(dog);
// body (along z, front = +z)
const body=new THREE.Group();dog.add(body);
mesh(sph,grey,[0,1.35,0],[.78,.8,1.25],[0,0,0],body);
mesh(sph,dark,[0,1.7,-.1],[.6,.4,1.0],[0,0,0],body); // darker back saddle
mesh(sph,light,[0,1.0,.55],[.6,.55,.6],[0,0,0],body); // chest
mesh(sph,light,[0,1.05,-.2],[.62,.4,.9],[0,0,0],body);
// legs
const legs=[];
function leg(x,z,front){
 const g=new THREE.Group();g.position.set(x,1.1,z);dog.add(g);
 mesh(cyl,light,[0,-.55,0],[.17,.9,.17],[0,0,0],g);
 mesh(sph,cream,[0,-1.03,.08],[.24,.1,.32],[0,0,0],g);
 mesh(sph,light,[0,-.15,0],[.26,.3,.26],[0,0,0],g);
 legs.push(g);return g;}
leg(.38,.7,1);leg(-.38,.7,1);leg(.38,-.65);leg(-.38,-.65);
// tail (docked)
const tail=new THREE.Group();tail.position.set(0,1.8,-1.25);body.add(tail);
mesh(cyl,grey,[0,.3,0],[.12,.6,.12],[0,0,0],tail);
mesh(sph,dark,[0,.6,0],[.13,.13,.13],[0,0,0],tail);
tail.rotation.x=-.25;
// neck
mesh(cyl,grey,[0,1.85,.9],[.33,.5,.33],[.6,0,0],dog);
// head
const head=new THREE.Group();head.position.set(0,2.3,1.2);dog.add(head);
mesh(sph,grey,[0,0,0],[.5,.45,.55],[0,0,0],head);
mesh(new THREE.BoxGeometry(1,1,1,2,2,2),dark,[0,.3,-.05],[.5,.1,.5],[0,0,0],head);
// muzzle & beard
mesh(box,cream,[0,-.12,.62],[.46,.34,.6],[0,0,0],head);
mesh(sph,cream,[0,-.12,.62],[.3,.2,.4],[0,0,0],head);
mesh(sph,cream,[0,-.42,.62],[.34,.36,.45],[.35,0,0],head); // beard
mesh(sph,cream,[.17,-.27,.88],[.2,.14,.2],[0,0,0],head);
mesh(sph,cream,[-.17,-.27,.88],[.2,.14,.2],[0,0,0],head); // moustache
mesh(sph,cream,[0,-.55,.5],[.22,.3,.25],[0,0,0],head);
mesh(sph,nose,[0,.07,.95],[.14,.1,.11],[0,0,0],head);
// eyebrows
for(const s of[1,-1]){
 mesh(sph,cream,[s*.2,.2,.5],[.2,.1,.3],[-.3,s*.2,s*-.25],head);
 mesh(sph,light,[s*.2,.22,.65],[.17,.08,.2],[-.3,0,s*-.2],head);
}
// eyes
const eyes=[];
for(const s of[1,-1]){
 const e=mesh(sph,black,[s*.2,.06,.52],[.06,.07,.05],[0,0,0],head);eyes.push(e);
 mesh(sph,M(0xffffff,.2),[s*.21,.085,.56],[.018,.018,.018],[0,0,0],head);
}
// ears (folded forward flaps)
const ears=[];
for(const s of[1,-1]){
 const eg=new THREE.Group();eg.position.set(s*.3,.34,.02);head.add(eg);
 mesh(sph,dark,[s*.06,0,.1],[.2,.06,.22],[.5,0,s*-.5],eg);
 mesh(sph,grey,[s*.1,-.05,.17],[.17,.05,.17],[.7,0,s*-.7],eg);
 ears.push(eg);
}
dog.position.y=0;
// stray whisker puffs on cheeks
for(const s of[1,-1])mesh(sph,light,[s*.38,-.1,.2],[.14,.2,.25],[0,0,0],head);

// animation
let nextBlink=2,blink=0;const clock=new THREE.Clock();
function loop(){
 const t=clock.getElapsedTime();
 head.position.y=2.3+Math.sin(t*2)*.04;head.rotation.x=Math.sin(t*2)*.04;head.rotation.y=Math.sin(t*.7)*.12;head.rotation.z=Math.sin(t*.9)*.04;
 tail.rotation.z=Math.sin(t*9)*.45;
 body.position.y=Math.sin(t*2)*.012;
 ears.forEach((e,i)=>e.rotation.x=Math.sin(t*2+i)*.03);
 if(t>nextBlink&&!blink){blink=t;}
 let k=1;if(blink){const d=(t-blink)/.16;if(d>=1){blink=0;nextBlink=t+2+Math.random()*3}else k=Math.max(.08,Math.abs(d*2-1));}
 eyes.forEach(e=>e.scale.y=.07*k);
 ctl.update();r.render(scene,cam);requestAnimationFrame(loop);
}
loop();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script></body></html>
